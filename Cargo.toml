[package]
name = "chief"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
libc = "0.2.191"
ratatui = "0.30.2"
rmcp = { version = "3.7.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "process", "time"] }
toml = "1.1.8"
unicode-width = "0.2.2"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
