# The demo's own tmux server (-L chief-demo): no status bar, quiet borders, true colour.
set -g status off
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g default-command "zsh -f"
set -g pane-border-style "fg=#3b3b4f"
set -g pane-active-border-style "fg=#3b3b4f"
set -g pane-border-lines heavy
set -g escape-time 0
# Arrow keys right after a prefix+arrow go to the pane, not to another pane switch.
set -g repeat-time 0
